name: .NET CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Restore, build, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore HR_System.sln

      - name: Audit NuGet packages
        run: dotnet list HR_System.sln package --vulnerable --include-transitive --no-restore

      - name: Build
        run: dotnet build HR_System.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test HR_System.sln --configuration Release --no-build
